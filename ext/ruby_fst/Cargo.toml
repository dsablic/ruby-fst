[package]
name = "ruby_fst"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }
fst = { version = "0.4", features = ["levenshtein"] }
memmap2 = "0.9"

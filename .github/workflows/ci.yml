name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.2', '3.3', '3.4']
        include:
          - os: ubuntu-latest
            ruby: head
            allow-failure: true
    continue-on-error: ${{ matrix.allow-failure || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true

      - run: bundle exec rake compile test

  cross:
    name: Cross-compile (${{ matrix.platform }})
    needs: [lint, test]
    if: |
      github.repository == 'dsablic/ruby-fst' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - x86_64-linux-musl
          - aarch64-linux
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.2,3.3,3.4'

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error

  publish:
    needs: [lint, test, cross]
    if: |
      github.repository == 'dsablic/ruby-fst' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build source gem
        run: |
          mkdir -p pkg
          gem build ruby_fst.gemspec --output "pkg/$(ruby -r./lib/ruby_fst/version -e 'print "ruby-fst-#{RubyFst::VERSION}.gem"')"
        shell: bash

      - uses: actions/download-artifact@v4
        with:
          path: pkg
          pattern: cross-gem-*
          merge-multiple: true

      - run: ls -la pkg

      - uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Push gems to RubyGems
        run: |
          for gem in pkg/*.gem; do
            gem push "$gem"
          done
        shell: bash

      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" v "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi
        shell: bash

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/*.gem
          body_path: release_notes.md
